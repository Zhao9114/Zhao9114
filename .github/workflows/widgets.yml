# Redraws the themed contribution widget every day
# and pushes it to the `output` branch, which the README reads from.
name: profile widgets

on:
  schedule:
    - cron: "17 6 * * *"   # daily, ~midnight Central
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli

      # night sea chart (writes dist/contrib-sea.svg)
      - run: python scripts/contrib.py --user ${{ github.repository_owner }} --style sea --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
